# ============================================
# Daytona Configuration for AI Closet Scanner
# ============================================
# Daytona SDK configuration for creating development sandboxes
# Docs: https://www.daytona.io/docs/

# This file is used if you're deploying via traditional methods
# For Daytona SDK integration, see: backend-api/daytona_deploy.py

workspace:
  name: ai-closet-scanner
  description: "AI-powered wardrobe management with Claude, Gemini, and ElevenLabs"
  version: "1.0.0"

# Runtime configuration
runtime:
  type: container
  image: python:3.11-slim

# Exposed ports
ports:
  - port: 8000
    name: fastapi-backend
    protocol: http
    visibility: public

# Environment variables
# NOTE: For Daytona SDK, set these in your .env file:
# DAYTONA_API_KEY=your-api-key (from https://app.daytona.io/dashboard/keys)
# DAYTONA_API_URL=https://app.daytona.io/api (default)
# DAYTONA_TARGET=us (optional)
environment:
  # Application environment variables
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  TIGRIS_ACCESS_KEY: ${TIGRIS_ACCESS_KEY}
  TIGRIS_SECRET_KEY: ${TIGRIS_SECRET_KEY}
  GALILEO_API_KEY: ${GALILEO_API_KEY}
  BREX_API_KEY: ${BREX_API_KEY}
  WEATHER_API_KEY: ${WEATHER_API_KEY}

  ENVIRONMENT: "production"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

# Lifecycle commands (for non-SDK deployment)
commands:
  install: |
    cd backend-api
    pip install -r requirements.txt

  start: |
    cd backend-api
    uvicorn app.main:app --host 0.0.0.0 --port 8000

# Resource allocation
resources:
  cpu: "2"
  memory: "4Gi"
  storage: "20Gi"
